<!-- meta: ② 앱 홍보용 | SNS 피드(인스타 카드뉴스 표지) | 정사각 1080×1080 | Ownglyph 99 손글씨 포인트 + Noto Sans KR Black | 밝은 Lavender 바탕 + Signal·Ink·Periwinkle | 질문형 손글씨 카피 → 기울인 회차 판정 캡처(폴라로이드 프레임) → 답 카피 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>드라이브 코치 — SNS 표지</title>
<style>
  :root{--ink:#070827;--peri:#5B60A1;--lav:#E5E6F0;--signal:#F52D48;--paper:#FCFCFA}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden}
  body{background:var(--lav);font-family:"Noto Sans KR",sans-serif;color:var(--ink);position:relative}
  .hand{font-family:"Ownglyph 99 Regular","Ownglyph 99","온글잎 99",cursive}
  /* 배경 점 격자 */
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(91,96,161,0.20) 2px, transparent 2.4px);background-size:36px 36px;}
  .top{position:absolute;left:72px;top:58px;right:72px;display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:700;color:var(--peri);letter-spacing:0.5px}
  .top .pill{background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 20px;font-size:20px;font-weight:700;letter-spacing:0}
  .q{position:absolute;left:66px;top:118px;font-size:124px;line-height:1.0;color:var(--ink);letter-spacing:-1px}
  .q .mark{color:var(--signal)}
  .scribble{position:absolute;left:300px;top:345px}

  .card{position:absolute;left:200px;top:392px;width:720px;background:var(--paper);padding:18px 18px 58px;border-radius:10px;
    transform:rotate(-5deg);box-shadow:0 30px 60px rgba(7,8,39,0.22), 0 4px 10px rgba(7,8,39,0.10)}
  .shot{width:100%;aspect-ratio:2560/1264;overflow:hidden;border-radius:4px}
  .shot img{display:block;width:100%;margin-top:-3.05%}
  .card .cap{position:absolute;left:24px;bottom:12px;font-size:32px;color:var(--peri)}
  .tape{position:absolute;top:-20px;left:300px;width:130px;height:40px;background:rgba(245,45,72,0.55);transform:rotate(4deg);border-radius:3px}


  .a{position:absolute;left:72px;top:856px}
  .a .l1{font-size:46px;font-weight:300;letter-spacing:-1.5px}
  .a .l1 b{font-weight:900}
  .a .l2{font-size:92px;font-weight:900;letter-spacing:-4px;line-height:1.0;color:var(--ink)}
  .a .l2 span{color:var(--signal)}
  .side{position:absolute;right:72px;bottom:60px;text-align:right}
  .side .why{font-size:38px;color:var(--ink);line-height:1.15}
  .side .sig{margin-top:14px;font-size:18px;font-weight:500;color:var(--peri);letter-spacing:0.3px}
  .side .sig b{font-weight:900;color:var(--ink)}
  .fine{position:absolute;left:72px;bottom:24px;font-size:14px;color:#7A7C9E;font-weight:400}
</style>
</head>
<body>
<div class="dots"></div>

<div class="top"><span>DRIVE COACH · 운전 연수 어시스턴트</span><span class="pill">넘겨 보기 →</span></div>

<div class="q hand">운전 가르치다<br>싸운 적 있나요<span class="mark">?</span></div>
<svg class="scribble" width="420" height="40" viewBox="0 0 420 40"><path d="M6 26 C 70 8, 140 34, 210 18 S 340 6, 412 22" fill="none" stroke="#F52D48" stroke-width="7" stroke-linecap="round"/></svg>

<div class="card">
  <div class="tape"></div>
  <div class="shot"><img src="../../screenshots/lesson/lesson-done-verdict-fix.png" alt="회차 판정 화면"></div>
  <div class="cap hand">주차 한 번 끝나면, 코치가 이렇게 말해요</div>
</div>

<div class="a">
  <div class="l1"><b>화내지 않는 조수석</b>,</div>
  <div class="l2"><span>드라이브</span> 코치</div>
</div>

<div class="side">
  <div class="why hand">장롱면허 10년차 아내를 위해<br>만들었어요</div>
  <div class="sig"><b>MOAH 2026</b> · 사고치조</div>
</div>

<div class="fine">차량용 안드로이드(AAOS) 앱 · 캡처는 외부 에뮬레이터 화면</div>
</body>
</html>
